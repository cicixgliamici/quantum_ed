[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-ed"
version = "0.1.0"
description = "Educational quantum computing toolkit + notebooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
# CI can test the library without installing the interactive notebook stack.
test = ["pytest>=8"]
dev = ["pytest>=8", "jupyterlab", "ipykernel"]
notebooks = ["nbconvert>=7", "ipykernel"]
docs = ["mkdocs-material>=9"]
# Qiskit is optional so the NumPy-first core remains lightweight.
showcase = ["qiskit>=2.0"]
openqasm = ["qiskit[qasm3-import]>=2.0"]
qsharp = ["qdk>=1.28"]
pennylane = ["pennylane>=0.45,<0.46"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Pin the resolver as well as its output; updates are intentional reviewable changes.
required-version = "==0.13.1"
