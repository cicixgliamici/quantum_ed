[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-ed"
version = "0.1.0"
description = "Educational quantum computing toolkit + notebooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyterlab", "ipykernel"]
# Qiskit is optional so the NumPy-first core remains lightweight.
showcase = ["qiskit>=2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
# Showcase files are runnable portfolio examples, not importable library code.
exclude = ["showcase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
