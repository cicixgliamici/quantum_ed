name: Publish documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish an active deployment before publishing the next revision.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-suffix: pages
      - name: Install the locked documentation environment
        run: uv sync --locked --extra docs --no-editable
      - name: Validate repository links
        run: uv run --no-sync python tools/verify_repository.py
      - name: Build with warnings treated as errors
        run: uv run --no-sync python -m mkdocs build --strict
      - name: Upload the generated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Manual runs on feature branches may build, but must not replace the site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the verified website
        id: deployment
        uses: actions/deploy-pages@v4
