name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # Keep every uv command on this interpreter, overriding .python-version.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned environment manager
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-suffix: core-${{ matrix.python }}
      - name: Install the locked package as a wheel
        run: uv sync --locked --python ${{ matrix.python }} --extra test --no-editable
      - name: Check dependency consistency
        run: uv pip check --python .venv
      - name: Record the actual environment and verify installation
        run: uv run --no-sync python -I tools/environment_report.py --require-wheel --output build/reproducibility/environment.json
      - name: Validate repository structure and source links
        run: uv run --no-sync python tools/verify_repository.py
      - name: Validate NumPy experiments
        run: uv run --no-sync python tools/validate_experiments.py --ecosystem numpy
      - name: Run core tests
        run: uv run --no-sync python -m pytest -q --junitxml=build/reproducibility/tests.xml
      - name: Reproduce the analytical Bell-noise study
        run: uv run --no-sync python -m studies.bell_noise.run_study --numpy-only --output-dir build/bell-noise-numpy
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ runner.os }}-py${{ matrix.python }}
          path: |
            build/reproducibility/
            build/bell-noise-numpy/

  qiskit:
    name: Qiskit / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14.3"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-suffix: qiskit-${{ matrix.python }}
      - name: Install locked Qiskit dependencies
        run: uv sync --locked --python ${{ matrix.python }} --extra test --extra showcase --no-editable
      - run: uv pip check --python .venv
      - run: uv run --no-sync python -I tools/environment_report.py --require-wheel
      - name: Validate Qiskit results and sampling
        run: uv run --no-sync python tools/validate_experiments.py --ecosystem qiskit
      - name: Test Qiskit behavior
        run: uv run --no-sync python -m pytest -q tests/experiments --junitxml=build/reproducibility/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qiskit-py${{ matrix.python }}
          path: build/reproducibility/

  openqasm:
    name: OpenQASM / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14.3"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-suffix: openqasm-${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }} --extra openqasm --no-editable
      - run: uv pip check --python .venv
      - run: uv run --no-sync python -I tools/environment_report.py --require-wheel
      - name: Execute OpenQASM programs and verify results
        run: uv run --no-sync python tools/validate_openqasm.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openqasm-py${{ matrix.python }}
          path: build/reproducibility/

  qsharp:
    name: Q# / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14.3"]
    env:
      QDK_PYTHON_TELEMETRY: none
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-suffix: qsharp-${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }} --extra qsharp --no-editable
      - run: uv pip check --python .venv
      - run: uv run --no-sync python -I tools/environment_report.py --require-wheel
      - name: Execute Q# programs and verify probabilities and phases
        run: uv run --no-sync python tools/validate_qsharp.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qsharp-py${{ matrix.python }}
          path: build/reproducibility/

  documentation:
    name: Documentation and notebook reproduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-suffix: documentation
      - run: uv sync --locked --extra docs --extra test --no-editable
      - run: uv pip check --python .venv
      - run: uv run --no-sync python -I tools/environment_report.py --require-wheel
      - name: Execute notebook copies and build the documentation site
        run: uv run --no-sync python -m mkdocs build --strict
      - name: Check notebook export and failure handling
        run: uv run --no-sync python -m pytest -q tests/test_notebook_docs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-reproduction
          path: |
            build/reproducibility/
            build/executed-notebooks/

  pennylane:
    name: PennyLane / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14.3"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-suffix: pennylane-${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }} --extra test --extra pennylane --no-editable
      - run: uv pip check --python .venv
      - run: uv run --no-sync python -I tools/environment_report.py --require-wheel
      - name: Validate PennyLane scientific results
        run: uv run --no-sync python tools/validate_experiments.py --ecosystem pennylane
      - name: Reproduce the full Bell-noise comparison
        run: uv run --no-sync python -m studies.bell_noise.run_study --output-dir build/bell-noise-comparison
      - name: Run ecosystem and study tests
        run: uv run --no-sync python -m pytest -q tests/experiments tests/studies --junitxml=build/reproducibility/tests.xml
      - name: Preserve cross-framework evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pennylane-py${{ matrix.python }}
          path: |
            build/reproducibility/
            build/bell-noise-comparison/
